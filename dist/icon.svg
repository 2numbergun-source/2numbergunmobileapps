<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Tactical Shield -->
  <path d="M 256 60 Q 380 70 410 130 Q 420 300 256 450 Q 92 300 102 130 Q 132 70 256 60 Z" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  <path d="M 256 75 Q 365 85 395 138 Q 403 285 256 430 Q 109 285 117 138 Q 147 85 256 75 Z" fill="#0b1329" opacity="0.85"/>

  <!-- Crossed Khukuris (Nepalese Police Insignia) -->
  <g transform="translate(256, 235) scale(0.95)">
    <!-- Right Khukuri -->
    <path d="M -80 70 Q -20 20 40 -60 Q 80 -110 90 -120 Q 95 -125 85 -120 Q 55 -100 20 -40 Q -10 10 -65 75 Z" fill="url(#goldGrad)"/>
    <path d="M -70 65 L -100 95 L -85 110 L -55 80 Z" fill="#ca8a04"/>
    <!-- Left Khukuri -->
    <path d="M 80 70 Q 20 20 -40 -60 Q -80 -110 -90 -120 Q -95 -125 -85 -120 Q -55 -100 -20 -40 Q 10 10 65 75 Z" fill="url(#goldGrad)"/>
    <path d="M 70 65 L 100 95 L 85 110 L 55 80 Z" fill="#ca8a04"/>
    <!-- Center Star & Wheel of Truth -->
    <circle cx="0" cy="-10" r="38" fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Star Points -->
    <polygon points="0,-42 10,-20 34,-20 15,-6 22,18 0,4 -22,18 -15,-6 -34,-20 -10,-20" fill="url(#goldGrad)"/>
  </g>

  <!-- Number "२" for Battalion No. 2 (गण नं. २) -->
  <circle cx="256" cy="335" r="36" fill="#1e3a8a" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="348" text-anchor="middle" font-family="'Mukta', sans-serif" font-weight="900" font-size="40" fill="#fef08a">२</text>

  <!-- Text Header & Footer -->
  <text x="256" y="420" text-anchor="middle" font-family="'Mukta', sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="1">महाराजगञ्ज</text>
  <text x="256" y="445" text-anchor="middle" font-family="'Mukta', sans-serif" font-weight="600" font-size="14" fill="#93c5fd" letter-spacing="2">NEPAL POLICE BATTALION</text>
</svg>
